<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Newsroom · Clockchain</title>
  <meta name="description"
    content="News, press, and media from Clockchain: the world's first verifiable global time network by D4D Sàrl." />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="assets/favicon-512.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@100;200;300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=5" />
  <link rel="stylesheet" href="site.css?v=19" />
  <script>window.CC_GA_ID = 'G-56GW11EBX3';</script>
  <script>(function () { try { var t = localStorage.getItem('cc-theme'); if (t === 'eclipse' || t === 'daylight') { document.documentElement.setAttribute('data-variant', t); } } catch (e) { } })();</script>
  <script>
    (function () {
      var root = document.documentElement;
      try {
        var saved = JSON.parse(localStorage.getItem('clockchain-merged-tweaks-v3') || 'null');
        if (saved) {
          if (saved.variant) { if (saved.variant === 'hybrid') { root.setAttribute('data-variant', 'daylight'); root.setAttribute('data-hybrid', '1'); } else { root.setAttribute('data-variant', saved.variant); } }
          if (saved.accent) root.setAttribute('data-accent', saved.accent);
          if (saved.displayFont) root.setAttribute('data-font', saved.displayFont);
          if (saved.bodyFont) root.setAttribute('data-bodyfont', saved.bodyFont);
          if (saved.headWeight) root.setAttribute('data-headweight', saved.headWeight);
          if (saved.bodyWeight) root.setAttribute('data-bodyweight', saved.bodyWeight);
          if (saved.density) root.setAttribute('data-density', saved.density);
        }
      } catch (e) { }
    })();
  </script>


  <script>
    function formatDateTime(timestamp) {
      if (!timestamp) return 'N/A';

      try {
        const date = typeof timestamp === 'number' ? new Date(timestamp) : new Date(timestamp);
        if (isNaN(date.getTime())) return String(timestamp);

        return new Intl.DateTimeFormat('en-US', {
          year: 'numeric',
          month: 'short',
          day: 'numeric',
        }).format(date);
      } catch {
        return String(timestamp);
      }
    }

    (() => {
      try {
        var pTime = fetch('https://stagingapi.clockchain.network/api/admin/cms/pages/bda92bac-b745-486a-b33c-f9718f131182')
          .then(function (r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.json();
          })
          .then(function (json) {
            var el = document.getElementById("dynamic-content")
            var content = json?.data?.additionalFields?.content
            if (content) {
              el.innerHTML = content
            }
          })
      } catch {

      }


      fetch('https://stagingapi.clockchain.network/api/admin/cms/news')
  .then(function (r) {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  })
  .then(function (json) {
    var content = json?.data || [];
    var el = document.getElementById("news-count")
    el.innerHTML = content.length + ' entries'

    var elements = content.map(function (item, idx) {
      return `
        <a
          class="media-card ${idx === 0 ? 'lead' : ''}"
          href="${item?.link || '#'}"
          target="_blank"
          rel="noopener noreferrer"
        >
          <div class="media-thumb">
            <img
              src="${item?.image || ''}"
              alt="${item?.title || ''}"
            />
          </div>

          <div class="media-body">
            <span class="media-source">${item?.type || ''}</span>

            <h4>${item?.title || ''}</h4>

            <div class="media-foot">
              <span class="media-date">
                ${formatDateTime(item?.time)}
              </span>

              <span class="media-read">
                Read article
                <svg viewBox="0 0 24 24">
                  <path d="M5 12h14M13 5l7 7-7 7"></path>
                </svg>
              </span>
            </div>
          </div>
        </a>
      `;
    }).join('');

    document.querySelector('.newsroom-container').innerHTML = elements;
  })
  .catch(function (error) {
    console.error('Failed to fetch news:', error);
  });

    })()
  </script>
</head>

<body>

  <a class="skip-link" href="#main-content">Skip to main content</a>

  <div class="scroll-progress" id="scroll-progress" aria-hidden="true"></div>

  <div id="site-nav"></div>


  <main id="main-content" tabindex="-1">
    <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span class="crumb-sep"
        aria-hidden="true">/</span><span aria-current="page">Newsroom</span></nav>

    <!-- ===== PAGE HERO ===== -->

      <div class="container">
        <div class="ph-inner">
          <span class="tag">Media</span>
          <h1>News, press &amp; <em>media.</em></h1>
          <p class="dek">Press releases, third-party coverage, and writing from the Clockchain team: the story of a
            blockchain-native global time standard, as it unfolds.</p>
          <div class="ph-jump">
            <a href="#blog">Blog</a>
            <a href="#news">Press releases</a>
            <a href="#media">In the media</a>
          </div>

    <div id="dynamic-content" style="min-height: 400px;">

      </div>
    </div>

    <section class="news" id="news" data-screen-label="News &amp; Media" style="padding-top: 0;">
      <div class="container">
        <div class="news-body">


          <div class="subhead" id="media">
            <div class="subhead-l"><span class="subhead-num">02</span>
              <h3>Media</h3>
            </div>
            <div class="subhead-rule"></div>
            <span class="subhead-count"><span id="news-count"><span> </span>
          </div>

          <div class="media-grid newsroom-container">
           
          </div>
        </div>

  </main>



  <div id="site-footer"></div>

  <!-- ===== Article modal ===== -->

    <div class="amodal-card">
      <div class="amodal-head">

        <button class="amodal-close" data-close aria-label="Close"><svg viewBox="0 0 24 24">
            <path d="M18 6L6 18M6 6l12 12" />
          </svg></button>
      </div>
      <div class="amodal-body">
        <h2 id="am-title">—</h2>
        <div id="am-content"></div>
      </div>
    </div>
  </div>

  <script src="components.js?v=3"></script>
  <script src="app.js?v=3"></script>

  <script src="consent.js?v=1"></script>
</body>

</html>
